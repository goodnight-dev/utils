name: Docs

on:
  # Docs are generated from source TSDoc (typedoc runs with includeVersion:
  # false), so only rebuild when something that changes the rendered site
  # changes. This skips release ("Version Packages") and dependency-bump merges,
  # which would otherwise republish an identical docs site on every push to main.
  push:
    branches: [main]
    paths:
      - 'packages/*/src/**'
      - 'packages/*/README.md'
      - 'typedoc.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Grant the token what it needs to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  LEFTHOOK: '0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API docs (TypeDoc)
        run: pnpm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
